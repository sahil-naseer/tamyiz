<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <!-- seo: replaced per page by scripts/build-pages.js (from src/data/seo.js) -->
  <title>TAMYIZ™ | Practical E-Books by Sahil &amp; Basit</title>
  <!-- /seo -->
  <meta name="theme-color" content="#0B0B0B" />
  <meta name="twitter:creator" content="@sahilnaseer0123" />

  <!-- Favicon (Geometric T• Monogram Seal) -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="256x256" href="/assets/images/tamyiz-logo-256.png" />
  <link rel="apple-touch-icon" href="/assets/images/tamyiz-logo-256.png" />

  <!-- The shop's e-books: start fetching while the app code downloads -->
  <link rel="preload" href="/api/products" as="fetch" crossorigin="anonymous" />

  <!-- Space Grotesk's extended file holds the ₹ sign (prices, the bag total), so every page needs it. Found only via the
       stylesheet it started late; preloading it made Lighthouse runs on home steadier (26 Nov 2026). -->
  <link rel="preload" href="/node_modules/@fontsource-variable/space-grotesk/files/space-grotesk-latin-ext-wght-normal.woff2" as="font" type="font/woff2" crossorigin />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="/src/styles/tamyiz-unified.css" />
</head>
<body>
  <!-- App Container. The placeholder below shows instantly (no white screen on slow connections);
       the app replaces it as soon as the e-books have loaded. -->
  <div id="app">
    <div class="tmz-boot" role="status" aria-label="Loading TAMYIZ">
      <div class="tmz-boot-head"><img src="/assets/brand/tamyiz-dome-sm.webp" alt="" width="58" height="17" /><img src="/assets/brand/tamyiz-wordmark.svg" alt="TAMYIZ" width="96" height="16" /></div>
      <div class="tmz-boot-progress"></div>
      <div class="tmz-boot-body">
        <span class="tmz-boot-line" style="width: 46%"></span>
        <span class="tmz-boot-line" style="width: 62%"></span>
        <span class="tmz-boot-line tmz-boot-thin" style="width: 38%"></span>
      </div>
      <noscript><p class="tmz-boot-noscript">TAMYIZ needs JavaScript to show the shop. Turn it on, or WhatsApp us on +91 95417 22379.</p></noscript>
    </div>
  </div>

  <!-- Unified TAMYIZ Script Entrypoint -->
  <script type="module" src="/src/scripts/tamyiz-unified-app.js"></script>

  <!-- TAMYIZ AI Support Widget -->
  <!-- Vee site tour: each stop is a CSS selector (or "launcher"), the words Vee says, and a gesture -->
  <script type="application/json" id="vee-tour">
[
 {"target":"#hero h1","gesture":"hello","text":"Hi, I'm Vee! Tamyiz means telling things apart, and our short e-books help you do just that. Let me show you around."},
 {"target":"#nav-link-editions","gesture":"point","text":"The menu takes you anywhere: all the e-books, how we write, and who we are."},
 {"target":"#editions .tamyiz-product-card","gesture":"read","text":"These are our latest e-books. Open any one to see what's inside and get the first chapter free."},
 {"target":"#editions h2","gesture":"love","text":"Buying more than one? 2 books are 20% off and 3 or more are 25% off. It's applied automatically at checkout."},
 {"target":"launcher","gesture":"bye","text":"That's the tour! Got a question, or lost a download? Tap me any time."}
]
  </script>
  <script src="/vee/widget.js?v=24" data-client="tamyiz" data-api-base="https://khala-ai-agents.pages.dev" data-agent-name="Vee" data-agent-note="Never paste website URLs or page links in your replies—the customer is already on the website." data-hide-tagline data-tour="#vee-tour" data-tour-no-offer defer></script>
</body>
</html>
